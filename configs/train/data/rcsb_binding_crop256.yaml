_target_: proteinzen.data.datasets.datamodule.TrainingDataset
max_crop_residues: 256
max_crop_rigids: 768
use_cropper: true
dataset_probs: [1.0]
remove_mol_types:
  - "DNA"
  - "RNA"
  - "NONPOLYMER"
datasets:
  - _target_: proteinzen.data.datasets.dataset.MMCIFDataset
    remove_mol_types:
      - "DNA"
      - "RNA"
      - "NONPOLYMER"
    only_multichain: true
    data_dir: /home/remote/ali16/data/rcsb_boltz
    data_sampler:
      _target_: proteinzen.boltz.data.sample.cluster.ClusterSampler
    task_sampler:
      _target_: proteinzen.runtime.training.task.TaskSampler
      task_list:
        - _target_: proteinzen.runtime.training.binder_design.BinderDesignWithBindingMotif
          noise_target: false
          prob: 1.0
          t_sched: lognorm
          lognorm_mu: 0.0
          lognorm_sig: 1.0
          beta_p1: 1.9
          beta_p2: 1.0
          t_min: 0.01
          t_max: 0.99
          boltzgen_mode: True