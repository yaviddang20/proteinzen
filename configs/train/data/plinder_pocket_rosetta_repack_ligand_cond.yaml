_target_: proteinzen.data.datasets.datamodule.TrainingDataset
max_crop_residues: 160
max_crop_rigids: 512
use_cropper: true
sidechain_ensemble_dir: ${oc.env:REPO_ROOT}/plinder_pocket_processed_sc_ensembles
sidechain_ensemble_prob: 0.5
datasets:
  - _target_: proteinzen.data.datasets.dataset.MMCIFDataset
    mode: train
    data_dir: ${oc.env:REPO_ROOT}/plinder_pocket_processed
    use_conformer_record: false
    data_sampler:
      _target_: proteinzen.boltz.data.sample.cluster.ClusterSampler
    task_sampler:
      _target_: proteinzen.runtime.training.task.TaskSampler
      task_list:
        - _target_: proteinzen.runtime.training.chain_conditioning.LigandConditionedGenerateProtein
          prob: 1.0
          t_sched: lognorm
          lognorm_mu: 0.0
          lognorm_sig: 1.0
          beta_p1: 1.9
          beta_p2: 1.0
          t_min: 0.01
          t_max: 0.99
          trans_prior_std: 16.0
          sig_perturb: 3.0
    exclude_mol_types:
      - "DNA"
      - "RNA"
    interface_crop: true
